<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JN STORE | Premium Watches and Perfumes</title>
<meta name="description" content="JN STORE: carefully selected premium watches and perfumes, delivered with confidence.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Manrope:wght@400;500;600&display=swap" rel="stylesheet">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"JN STORE"}</script>
<style>
:root{--ink:#1d1d20;--ink2:#2a2a2e;--ivory:#f5f1e8;--sand:#e7e0d1;--brass:#a98c5c;--mute:#8b877d;--line:#d8d1c1;--r:2px;--display:'Cormorant Garamond',Georgia,serif;--sans:'Manrope',system-ui,sans-serif;--s1:8px;--s2:16px;--s3:24px;--s4:48px;--s5:96px}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth;scroll-padding-top:calc(72px + env(safe-area-inset-top,0px))}
body{background:var(--ivory);color:var(--ink);font:400 16px/1.6 var(--sans);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding:0 var(--s3)}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.05;letter-spacing:-.01em}
h1{font-size:clamp(2.8rem,7vw,5.6rem)}h2{font-size:clamp(2rem,4vw,3.2rem)}
.bar{background:var(--ink);color:var(--sand);font-size:13px;text-align:center;padding:8px var(--s2)}
header{position:sticky;top:0;z-index:20;background:rgba(245,241,232,.96);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:var(--s3)}
.logo{font-family:var(--display);font-size:1.7rem;font-weight:600;letter-spacing:.14em}
.links{display:flex;gap:var(--s3);font-size:14px;font-weight:500}.links a{padding:8px 0;border-bottom:1px solid transparent}.links a:hover{border-color:var(--brass)}
.tools{display:flex;gap:4px}.ib{min-width:44px;min-height:44px;display:grid;place-items:center;position:relative;font-size:14px;font-weight:500}
.cnt{position:absolute;top:4px;right:2px;background:var(--ink);color:var(--ivory);font-size:11px;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center}
.burger{display:none}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:48px;padding:0 28px;background:var(--ink);color:var(--ivory);font-weight:600;font-size:14px;letter-spacing:.04em;border-radius:var(--r);transition:background .2s}
.btn:hover{background:var(--brass)}.btn.alt{background:none;color:var(--ink);border:1px solid var(--ink)}.btn.alt:hover{background:var(--ink);color:var(--ivory)}.btn.full{width:100%}
.hero{background:var(--ink);color:var(--ivory);overflow:hidden}
.hero .wrap{display:grid;grid-template-columns:1.1fr .9fr;align-items:center;gap:var(--s4);min-height:min(78vh,720px);padding-top:var(--s4);padding-bottom:var(--s4)}
.hero p{max-width:44ch;color:var(--sand);margin:var(--s3) 0 var(--s4);font-size:1.1rem}
.hero .cta{display:flex;gap:var(--s2);flex-wrap:wrap}.hero .btn{background:var(--ivory);color:var(--ink)}.hero .btn:hover{background:var(--brass);color:var(--ink)}.hero .btn.alt{background:none;color:var(--ivory);border-color:var(--mute)}
.face{width:min(100%,440px);margin:auto;aspect-ratio:1}.face svg{width:100%;height:100%}
.sec{padding:var(--s5) 0}.sec.dark{background:var(--ink);color:var(--ivory)}.sec.sand{background:var(--sand)}
.head{display:flex;justify-content:space-between;align-items:end;gap:var(--s3);flex-wrap:wrap;margin-bottom:var(--s4)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3)}
.coll{position:relative;background:var(--ink2);color:var(--ivory);min-height:420px;display:flex;flex-direction:column;justify-content:end;padding:var(--s4);overflow:hidden}
.coll svg{position:absolute;right:8%;top:8%;height:60%;opacity:.95;transition:transform .5s}.coll:hover svg{transform:translateY(-6px)}
.coll h3{font-size:2.4rem}.coll span{color:var(--sand);font-size:14px}
.tabs{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.tab{padding:10px 4px;font-weight:500;border-bottom:2px solid transparent;min-height:44px}.tab[aria-pressed=true]{border-color:var(--ink)}
select{min-height:44px;padding:0 12px;border:1px solid var(--line);background:var(--ivory);font:inherit;border-radius:var(--r)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s3)}
.card{display:flex;flex-direction:column;text-align:left}
.pic{aspect-ratio:4/5;background:var(--sand);display:grid;place-items:center;position:relative;overflow:hidden}
.pic svg{height:78%;transition:transform .5s}.card:hover .pic svg{transform:scale(1.04)}
.tag{position:absolute;left:10px;top:10px;font-size:12px;background:var(--ivory);padding:2px 8px}
.card h3{font-size:1.4rem;margin-top:var(--s2);line-height:1.15}.card .m{color:var(--mute);font-size:14px}
.pr{font-weight:600;margin-top:4px}.pr s{color:var(--mute);font-weight:400;margin-left:8px}
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--s4)}.trust h3{font-size:1.5rem;margin-bottom:6px}.trust p{font-size:14px;color:var(--mute)}
.story{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);align-items:center}.story p{color:var(--sand);max-width:52ch;margin-top:var(--s3)}
.nl{display:flex;gap:8px;max-width:460px;margin-top:var(--s3)}.nl input{flex:1;min-height:48px;padding:0 14px;border:1px solid var(--line);background:var(--ivory);font:inherit;border-radius:var(--r)}
footer{background:var(--ink);color:var(--sand);padding:var(--s4) 0;font-size:14px}footer .wrap{display:flex;justify-content:space-between;gap:var(--s3);flex-wrap:wrap}
.ph{color:var(--brass)}
.ov{position:fixed;inset:0;background:rgba(20,20,22,.55);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}.ov.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100%);background:var(--ivory);z-index:41;transform:translateX(100%);transition:transform .3s;display:flex;flex-direction:column;padding:var(--s3)}.drawer.on{transform:none}
.drawer .lst{flex:1;overflow:auto;margin:var(--s2) 0}
.li{display:grid;grid-template-columns:72px 1fr auto;gap:var(--s2);padding:var(--s2) 0;border-bottom:1px solid var(--line);align-items:center}.li .pic{aspect-ratio:1}
.q{display:inline-flex;border:1px solid var(--line);align-items:center}.q button{width:40px;height:40px}.q span{min-width:28px;text-align:center}
.tot{display:flex;justify-content:space-between;font-weight:600;font-size:1.1rem;margin:var(--s2) 0}
.srch{position:fixed;top:0;left:0;right:0;background:var(--ivory);z-index:42;padding:var(--s3);transform:translateY(-100%);transition:transform .25s}.srch.on{transform:none}
.srch input{width:100%;min-height:52px;font:inherit;font-size:1.2rem;border:0;border-bottom:1px solid var(--ink);background:none;padding:0}
.srch .res{max-height:50vh;overflow:auto;margin-top:var(--s2)}.srch .res a{display:block;padding:10px 0;border-bottom:1px solid var(--line)}
.pdp{display:grid;grid-template-columns:1.1fr .9fr;gap:var(--s4);padding:var(--s4) 0 var(--s5)}
.gal .big{aspect-ratio:1;background:var(--sand);display:grid;place-items:center;overflow:hidden;cursor:zoom-in}.gal .big svg{height:86%;transition:transform .3s}
.gal .big.z svg{transform:scale(1.9)}
.th{display:flex;gap:var(--s1);margin-top:var(--s1)}.th button{width:76px;height:76px;background:var(--sand);border:1px solid transparent;display:grid;place-items:center}.th button[aria-current=true]{border-color:var(--ink)}.th svg{height:80%}
.info h1{font-size:clamp(2.2rem,4vw,3.4rem)}.info .pr{font-size:1.5rem;margin:var(--s2) 0}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px var(--s3);margin:var(--s3) 0;font-size:14px}dt{color:var(--mute)}
.note{font-size:13px;color:var(--mute);border-top:1px solid var(--line);padding-top:var(--s2);margin-top:var(--s3)}
.crumb{font-size:13px;color:var(--mute);padding-top:var(--s3)}
.co{display:grid;grid-template-columns:1.2fr .8fr;gap:var(--s4);padding:var(--s4) 0 var(--s5)}
label{display:block;font-size:14px;font-weight:500;margin-top:var(--s2)}
.f{width:100%;min-height:48px;padding:0 14px;border:1px solid var(--line);background:#fff;font:inherit;border-radius:var(--r);margin-top:4px}
.f[aria-invalid=true]{border-color:#a3362b}.err{color:#a3362b;font-size:13px;min-height:18px}
.pay{border:1px solid var(--line);padding:var(--s2);margin-top:var(--s2);display:flex;gap:12px;align-items:start}
.sum{background:var(--sand);padding:var(--s3);align-self:start}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ivory);padding:12px 20px;z-index:60;opacity:0;transition:.25s;pointer-events:none;font-size:14px}.toast.on{opacity:1;transform:translate(-50%,0)}
.sr{position:absolute;left:-9999px}
@media(max-width:960px){.grid{grid-template-columns:repeat(2,1fr)}.trust{grid-template-columns:1fr 1fr}.hero .wrap,.story,.pdp,.co{grid-template-columns:1fr}.face{max-width:300px}.hero .wrap{min-height:0}}
@media(max-width:720px){.links{position:fixed;inset:calc(72px + env(safe-area-inset-top,0px)) 0 0 0;background:var(--ivory);flex-direction:column;padding:var(--s3);gap:var(--s2);font-size:1.4rem;font-family:var(--display);transform:translateX(-100%);transition:transform .25s}.links.on{transform:none}.burger{display:grid}.cols{grid-template-columns:1fr}.coll{min-height:320px}.sec{padding:var(--s4) 0}.wrap{padding:0 var(--s2)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style></head><body>
<div class="bar" id="bar"></div>
<header><div class="wrap nav">
<button class="ib burger" id="bg" aria-label="Menu" aria-expanded="false">Menu</button>
<a href="#/" class="logo" aria-label="JN STORE home">JN STORE</a>
<nav class="links" id="lk" aria-label="Main"><a href="#/shop/watch">Watches</a><a href="#/shop/perfume">Perfumes</a><a href="#/shop/all">Collections</a><a href="#/shop/new">New arrivals</a><a href="#/shop/best">Best sellers</a></nav>
<div class="tools"><button class="ib" id="sb" aria-label="Search">Search</button><button class="ib" id="cb" aria-label="Open cart">Cart<span class="cnt" id="cn">0</span></button></div>
</div></header>
<main id="app"></main>
<footer><div class="wrap"><div><div class="logo" style="color:var(--ivory)">JN STORE</div><p style="margin-top:8px">Premium products. Carefully selected. Delivered with confidence.</p></div>
<div id="ft"></div><div>Sample catalogue: replace products, prices and policies in CONFIG before launch.</div></div></footer>
<div class="ov" id="ov"></div>
<aside class="drawer" id="dr" aria-label="Cart"></aside>
<div class="srch" id="sr" role="search"><input id="si" type="search" placeholder="Search watches and perfumes" aria-label="Search"><div class="res" id="rs"></div><button class="btn alt" id="sx" style="margin-top:16px">Close</button></div>
<div class="toast" id="ts" role="status"></div>
<script>
/* ===== CONFIG: replace every placeholder before launch ===== */
const CONFIG={currency:'PKR',locale:'en-PK',
announcement:'Delivery, payment and return details: set in CONFIG',
STORE_PHONE:'',STORE_EMAIL:'',STORE_ADDRESS:'',WHATSAPP:'',
DELIVERY_POLICY:'',RETURN_POLICY:'',WARRANTY_POLICY:'',PAYMENT_METHODS:[],SOCIAL_LINKS:[],
shippingFee:0, /* set per zone once courier is configured */
/* Integration points: PAYMENT_PROVIDER (none), COURIER (none), ORDER_API (none) */
};
/* ===== PRODUCTS (sample data, marked sample in UI). Add real items here. ===== */
const P=[
{id:'w1',slug:'classic-steel-watch',cat:'watch',name:'Classic Steel Watch',price:45000,was:52000,stock:5,best:1,neu:0,dial:'#f5f1e8',case:'#c9c9cc',strap:'#2a2a2e',tags:['classic'],desc:'A clean three-hand design with a light dial.',spec:{'Dial colour':'Ivory','Category':'Classic'}},
{id:'w2',slug:'minimal-black-watch',cat:'watch',name:'Minimal Black Watch',price:38000,stock:8,best:0,neu:1,dial:'#1d1d20',case:'#a98c5c',strap:'#5a4a36',tags:['minimal'],desc:'A dark, uncluttered dial with a brass-tone case.',spec:{'Dial colour':'Black','Category':'Minimal'}},
{id:'w3',slug:'chronograph-slate-watch',cat:'watch',name:'Chronograph Slate',price:62000,stock:3,best:1,neu:1,dial:'#4a4d55',case:'#c9c9cc',strap:'#1d1d20',tags:['chronograph'],desc:'A slate dial with sub-dials for timing.',spec:{'Dial colour':'Slate','Category':'Chronograph'}},
{id:'w4',slug:'rose-dial-watch',cat:'watch',name:'Rose Dial Watch',price:41000,was:46000,stock:0,best:0,neu:0,dial:'#d9b8a8',case:'#c9b28a',strap:'#7a5b4a',tags:['classic'],desc:'A soft rose dial on a warm-tone case.',spec:{'Dial colour':'Rose','Category':'Classic'}},
{id:'p1',slug:'oud-noir-perfume',cat:'perfume',name:'Oud Noir',price:18500,stock:12,best:1,neu:0,glass:'#2a2a2e',liq:'#7a5b3a',tags:['unisex'],desc:'A deep, dark bottle for evening wear.',spec:{'For':'Unisex'}},
{id:'p2',slug:'amber-ivory-perfume',cat:'perfume',name:'Amber Ivory',price:16000,stock:9,best:0,neu:1,glass:'#e9dfc8',liq:'#c9a45c',tags:['unisex'],desc:'A warm amber tone in a pale glass bottle.',spec:{'For':'Unisex'}},
{id:'p3',slug:'citrus-blanc-perfume',cat:'perfume',name:'Citrus Blanc',price:14500,was:16500,stock:15,best:1,neu:1,glass:'#d6dccf',liq:'#d9cf7a',tags:['men'],desc:'A bright, clear bottle for daytime.',spec:{'For':'Men'}},
{id:'p4',slug:'velvet-musk-perfume',cat:'perfume',name:'Velvet Musk',price:17500,stock:6,best:0,neu:0,glass:'#d9b8a8',liq:'#b57f6c',tags:['women'],desc:'A blush bottle with a soft, rounded shape.',spec:{'For':'Women'}}];
/* ===== helpers ===== */
const $=s=>document.querySelector(s),money=n=>new Intl.NumberFormat(CONFIG.locale,{style:'currency',currency:CONFIG.currency,maximumFractionDigits:0}).format(n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function art(p,v){v=v||0;const z=v==2?'viewBox="60 60 80 80"':'viewBox="0 0 200 240"',r=v==1?'transform="rotate(-8 100 120)"':'';
if(p.cat=='watch'){const t=[...Array(12)].map((_,i)=>`<line x1="100" y1="58" x2="100" y2="${i%3?64:68}" stroke="${p.dial=='#f5f1e8'||p.dial=='#d9b8a8'?'#1d1d20':'#f5f1e8'}" stroke-width="2" transform="rotate(${i*30} 100 120)"/>`).join('');
const h=p.dial=='#f5f1e8'||p.dial=='#d9b8a8'?'#1d1d20':'#f5f1e8';
return `<svg ${z} role="img" aria-label="${esc(p.name)}"><g ${r}><rect x="78" y="0" width="44" height="240" fill="${p.strap}"/><circle cx="100" cy="120" r="64" fill="${p.case}"/><circle cx="100" cy="120" r="55" fill="${p.dial}"/>${t}<line x1="100" y1="120" x2="100" y2="82" stroke="${h}" stroke-width="3" stroke-linecap="round" transform="rotate(${v*40+300} 100 120)"/><line x1="100" y1="120" x2="100" y2="70" stroke="${h}" stroke-width="2" stroke-linecap="round" transform="rotate(${v*30+60} 100 120)"/><circle cx="100" cy="120" r="3" fill="${p.case}"/></g></svg>`}
return `<svg ${z} role="img" aria-label="${esc(p.name)}"><g ${r}><rect x="84" y="24" width="32" height="34" fill="#a98c5c"/><rect x="92" y="58" width="16" height="14" fill="#c9c9cc"/><rect x="52" y="72" width="96" height="140" rx="6" fill="${p.glass}"/><rect x="60" y="120" width="80" height="84" rx="3" fill="${p.liq}" opacity=".85"/><rect x="72" y="88" width="56" height="20" fill="none" stroke="#f5f1e8" stroke-opacity=".6"/></g></svg>`}
/* cart */
let cart=[];try{cart=JSON.parse(localStorage.getItem('jn-cart')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('jn-cart',JSON.stringify(cart))}catch(e){}};
const byId=id=>P.find(p=>p.id==id),count=()=>cart.reduce((a,c)=>a+c.q,0),sub=()=>cart.reduce((a,c)=>a+c.q*byId(c.id).price,0);
function toast(m){const t=$('#ts');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function add(id,q){const p=byId(id);if(!p||p.stock<1)return;const c=cart.find(x=>x.id==id);if(c)c.q=Math.min(c.q+q,p.stock);else cart.push({id,q});save();paint();toast(p.name+' added to cart');openCart()}
function paint(){$('#cn').textContent=count();renderCart()}
function renderCart(){const d=$('#dr');d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:2rem">Your cart</h2><button class="ib" id="cc" aria-label="Close cart">Close</button></div><div class="lst">${cart.length?cart.map(c=>{const p=byId(c.id);return `<div class="li"><div class="pic">${art(p)}</div><div><a href="#/p/${p.slug}"><strong>${esc(p.name)}</strong></a><div class="m">${money(p.price)}</div><div class="q" style="margin-top:6px"><button data-d="${p.id}:-1" aria-label="Decrease">−</button><span>${c.q}</span><button data-d="${p.id}:1" aria-label="Increase">+</button></div></div><button data-rm="${p.id}" class="m" style="text-decoration:underline">Remove</button></div>`}).join(''):'<p>Your cart is empty. Browse the collections to add a watch or perfume.</p>'}</div><div class="tot"><span>Subtotal</span><span>${money(sub())}</span></div><p class="m" style="font-size:13px;margin-bottom:12px">Delivery is calculated at checkout.</p><a href="#/checkout" class="btn full" ${cart.length?'':'aria-disabled="true" style="opacity:.4;pointer-events:none"'}>Go to checkout</a>`}
$('#dr').addEventListener('click',e=>{const t=e.target,d=t.dataset.d,r=t.dataset.rm;if(t.id=='cc')closeAll();if(d){const[i,n]=d.split(':'),c=cart.find(x=>x.id==i);c.q+=+n;if(c.q<1)cart=cart.filter(x=>x!=c);if(c&&c.q>byId(i).stock)c.q=byId(i).stock;save();paint()}if(r){cart=cart.filter(x=>x.id!=r);save();paint()}if(t.closest('a[href^="#/"]'))closeAll()});
function openCart(){$('#dr').classList.add('on');$('#ov').classList.add('on')}
function closeAll(){['#dr','#ov','#sr'].forEach(s=>$(s).classList.remove('on'));$('#lk').classList.remove('on');$('#bg').setAttribute('aria-expanded','false')}
$('#cb').onclick=openCart;$('#ov').onclick=closeAll;$('#sx').onclick=closeAll;document.addEventListener('keydown',e=>{if(e.key=='Escape')closeAll()});
$('#bg').onclick=()=>{const o=$('#lk').classList.toggle('on');$('#bg').setAttribute('aria-expanded',o)};$('#lk').onclick=e=>{if(e.target.tagName=='A')closeAll()};
$('#sb').onclick=()=>{$('#sr').classList.add('on');$('#ov').classList.add('on');$('#si').focus()};
$('#si').oninput=e=>{const q=e.target.value.trim().toLowerCase(),r=q?P.filter(p=>(p.name+p.cat+p.tags.join(' ')+p.desc).toLowerCase().includes(q)):[];$('#rs').innerHTML=q?(r.length?r.map(p=>`<a href="#/p/${p.slug}">${esc(p.name)} <span class="m">${money(p.price)}</span></a>`).join(''):'<p class="m">No matches. Try "watch", "perfume" or "unisex".</p>'):'';};
$('#rs').onclick=e=>{if(e.target.closest('a'))closeAll()};
/* views */
function card(p){const off=p.was?Math.round((1-p.price/p.was)*100):0;return `<a class="card" href="#/p/${p.slug}"><div class="pic">${art(p)}<span class="tag">${p.stock?(off?off+'% off':(p.neu?'New':'Sample')):'Sold out'}</span></div><h3>${esc(p.name)}</h3><div class="m">${p.cat=='watch'?'Watch':'Perfume'}</div><div class="pr">${money(p.price)}${p.was?`<s>${money(p.was)}</s>`:''}</div></a>`}
let F={cat:'all',sort:'feat'};
function list(){let r=P.filter(p=>F.cat=='all'||(F.cat=='new'?p.neu:F.cat=='best'?p.best:p.cat==F.cat));if(F.sort=='lo')r.sort((a,b)=>a.price-b.price);if(F.sort=='hi')r.sort((a,b)=>b.price-a.price);return r}
function shop(){const tb=[['all','All'],['watch','Watches'],['perfume','Perfumes'],['new','New arrivals'],['best','Best sellers']];
return `<div class="tabs" role="group" aria-label="Filter">${tb.map(t=>`<button class="tab" data-f="${t[0]}" aria-pressed="${F.cat==t[0]}">${t[1]}</button>`).join('')}<label class="sr" for="so">Sort</label><select id="so" style="margin-left:auto"><option value="feat">Featured</option><option value="lo" ${F.sort=='lo'?'selected':''}>Price: low to high</option><option value="hi" ${F.sort=='hi'?'selected':''}>Price: high to low</option></select></div><div class="grid" id="gr" style="margin-top:24px">${list().map(card).join('')||'<p>No products here yet.</p>'}</div>`}
function home(f){const w=P[0],pf=P[4];
return `<section class="hero"><div class="wrap"><div><h1>Watches and perfumes, chosen with care.</h1><p>A small, considered range of premium timepieces and fragrances, delivered with confidence across Pakistan.</p><div class="cta"><a class="btn" href="#/shop/watch">Shop watches</a><a class="btn alt" href="#/shop/perfume">Shop perfumes</a></div></div>
<div class="face" aria-hidden="true"><svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="96" fill="#2a2a2e"/><circle cx="100" cy="100" r="88" fill="#1d1d20" stroke="#a98c5c" stroke-width="1.5"/>${[...Array(60)].map((_,i)=>`<line x1="100" y1="16" x2="100" y2="${i%5?20:26}" stroke="${i%5?'#8b877d':'#f5f1e8'}" stroke-width="${i%5?.8:2}" transform="rotate(${i*6} 100 100)"/>`).join('')}<text x="100" y="66" text-anchor="middle" fill="#f5f1e8" font-family="Cormorant Garamond,serif" font-size="13" letter-spacing="3">JN STORE</text><g id="hh"><line x1="100" y1="100" x2="100" y2="54" stroke="#f5f1e8" stroke-width="4" stroke-linecap="round"/></g><g id="mh"><line x1="100" y1="100" x2="100" y2="34" stroke="#f5f1e8" stroke-width="2.6" stroke-linecap="round"/></g><g id="sh"><line x1="100" y1="112" x2="100" y2="26" stroke="#a98c5c" stroke-width="1.2"/></g><circle cx="100" cy="100" r="4" fill="#a98c5c"/></svg></div></div></section>
<section class="sec"><div class="wrap"><div class="head"><h2>Two collections</h2></div><div class="cols"><a class="coll" href="#/shop/watch">${art(w)}<h3>Watches</h3><span>${P.filter(p=>p.cat=='watch').length} sample pieces</span></a><a class="coll" href="#/shop/perfume">${art(pf)}<h3>Perfumes</h3><span>${P.filter(p=>p.cat=='perfume').length} sample fragrances</span></a></div></div></section>
<section class="sec sand" id="shop"><div class="wrap"><div class="head"><h2>Shop the range</h2></div><div id="shopbox">${shop()}</div></div></section>
<section class="sec dark"><div class="wrap story"><h2>Fewer products. Better choices.</h2><p>JN STORE starts with watches and perfumes and may grow into gifts. Every product is picked to be worth owning, and every order is handled with the same care. Add your own brand story here in CONFIG.</p></div></section>
<section class="sec"><div class="wrap trust">${[['Secure checkout','Payment methods are added once your provider is configured.'],['Delivery','Delivery times and fees appear here once set by the store.'],['Returns','Return policy appears here once confirmed by the store.'],['Support','Phone and WhatsApp appear here once added to CONFIG.']].map(t=>`<div><h3>${t[0]}</h3><p>${t[1]}</p></div>`).join('')}</div></section>
<section class="sec sand"><div class="wrap"><h2>New arrivals, by email</h2><form class="nl" id="nl"><label class="sr" for="ne">Email</label><input id="ne" type="email" required placeholder="Your email address"><button class="btn">Subscribe</button></form></div></section>`}
function pdp(s){const p=P.find(x=>x.slug==s);if(!p)return '<div class="wrap sec"><h2>Product not found</h2><p><a href="#/" style="text-decoration:underline">Back to the store</a></p></div>';
document.title=p.name+' | JN STORE';const rel=P.filter(x=>x.cat==p.cat&&x.id!=p.id).slice(0,4),off=p.was?Math.round((1-p.price/p.was)*100):0;
return `<div class="wrap"><div class="crumb"><a href="#/">Home</a> / <a href="#/shop/${p.cat}">${p.cat=='watch'?'Watches':'Perfumes'}</a> / ${esc(p.name)}</div><div class="pdp"><div class="gal"><div class="big" id="bg2" role="button" tabindex="0" aria-label="Toggle zoom">${art(p,0)}</div><div class="th">${[0,1,2].map(i=>`<button data-v="${i}" aria-label="View ${i+1}" aria-current="${i==0}">${art(p,i)}</button>`).join('')}</div></div>
<div class="info"><h1>${esc(p.name)}</h1><div class="pr">${money(p.price)}${p.was?`<s>${money(p.was)}</s> <span class="ph" style="font-size:14px">${off}% off</span>`:''}</div><p>${esc(p.desc)}</p><dl>${Object.entries(p.spec).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}<dt>Availability</dt><dd>${p.stock?(p.stock<6?'Low stock: '+p.stock+' left':'In stock'):'Sold out'}</dd></dl>
${p.stock?`<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div class="q"><button id="qm" aria-label="Decrease quantity">−</button><span id="qv" aria-live="polite">1</span><button id="qp" aria-label="Increase quantity">+</button></div><button class="btn" id="ad" style="flex:1;min-width:180px">Add to cart</button></div><button class="btn alt full" id="bn" style="margin-top:12px">Buy now</button>`:'<button class="btn full" disabled style="opacity:.4">Sold out</button>'}
<div class="note"><p>Delivery: <span class="ph">set DELIVERY_POLICY in CONFIG</span></p><p>Returns: <span class="ph">set RETURN_POLICY in CONFIG</span></p><p>Payment: <span class="ph">set PAYMENT_METHODS in CONFIG</span></p><p style="margin-top:8px">This is a sample listing. Add real specifications, notes and photos before launch.</p></div></div></div>
<h2 style="margin-bottom:24px">You may also like</h2><div class="grid" style="padding-bottom:64px">${rel.map(card).join('')}</div></div>`}
function checkout(){if(!cart.length)return '<div class="wrap sec"><h2>Your cart is empty</h2><p style="margin:16px 0">Add a watch or perfume to continue.</p><a class="btn" href="#/">Back to the store</a></div>';
const fld=(id,l,t,x)=>`<label for="${id}">${l}</label><input class="f" id="${id}" name="${id}" type="${t||'text'}" ${x||''} required><div class="err" id="e-${id}"></div>`;
return `<div class="wrap co"><form id="cf" novalidate><h1 style="font-size:2.6rem">Checkout</h1>${fld('nm','Full name','text','autocomplete="name"')}${fld('ph','Mobile number','tel','autocomplete="tel" placeholder="03XX XXXXXXX" inputmode="tel"')}${fld('em','Email (optional)','email','autocomplete="email"').replace(' required','')}${fld('ad','Delivery address','text','autocomplete="street-address"')}${fld('ci','City','text','autocomplete="address-level2"')}
<h2 style="font-size:1.6rem;margin-top:32px">Payment</h2>${CONFIG.PAYMENT_METHODS.length?'':'<div class="pay"><div><strong>No payment method configured yet</strong><p class="m" style="font-size:14px">Add Cash on Delivery or an online provider in CONFIG.PAYMENT_METHODS. Orders here are saved as requests only.</p></div></div>'}<button class="btn full" style="margin-top:24px">Place order request</button></form>
<div class="sum"><h2 style="font-size:1.8rem;margin-bottom:12px">Order summary</h2>${cart.map(c=>{const p=byId(c.id);return `<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0"><span>${esc(p.name)} × ${c.q}</span><span>${money(p.price*c.q)}</span></div>`}).join('')}<div class="tot" style="border-top:1px solid var(--line);padding-top:12px"><span>Subtotal</span><span>${money(sub())}</span></div><p class="m" style="font-size:13px">Delivery fee: ${CONFIG.shippingFee?money(CONFIG.shippingFee):'to be confirmed'}</p></div></div>`}
function route(){const h=location.hash||'#/',app=$('#app');document.title='JN STORE | Premium Watches and Perfumes';let m;
if(m=h.match(/^#\/shop\/(\w+)/)){F.cat=m[1];app.innerHTML=home();$('#shop').scrollIntoView();}
else if(m=h.match(/^#\/p\/(.+)/)){app.innerHTML=pdp(m[1]);scrollTo(0,0);wirePdp(m[1])}
else if(h=='#/checkout'){app.innerHTML=checkout();scrollTo(0,0);wireCo()}
else{app.innerHTML=home();scrollTo(0,0)}
if(!m||h.startsWith('#/shop')||h=='#/')tick();}
function wirePdp(s){const p=P.find(x=>x.slug==s);if(!p)return;let q=1;const big=$('#bg2'),qv=$('#qv');
big.onclick=()=>big.classList.toggle('z');big.onkeydown=e=>{if(e.key=='Enter'||e.key==' '){e.preventDefault();big.classList.toggle('z')}};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{big.innerHTML=art(p,+b.dataset.v);big.classList.remove('z');document.querySelectorAll('[data-v]').forEach(x=>x.setAttribute('aria-current',x==b))});
if(!p.stock)return;$('#qm').onclick=()=>{q=Math.max(1,q-1);qv.textContent=q};$('#qp').onclick=()=>{q=Math.min(p.stock,q+1);qv.textContent=q};
$('#ad').onclick=()=>add(p.id,q);$('#bn').onclick=()=>{add(p.id,q);closeAll();location.hash='#/checkout'}}
function wireCo(){const f=$('#cf');if(!f)return;f.onsubmit=e=>{e.preventDefault();const v=id=>$('#'+id).value.trim(),bad={};
if(v('nm').length<3)bad.nm='Enter your full name.';if(!/^(\+92|0)?3\d{2}[\s-]?\d{7}$/.test(v('ph')))bad.ph='Enter a Pakistani mobile number, like 0300 1234567.';
if(v('em')&&!/^\S+@\S+\.\S+$/.test(v('em')))bad.em='Enter a valid email address.';if(v('ad').length<8)bad.ad='Enter your full delivery address.';if(v('ci').length<2)bad.ci='Enter your city.';
['nm','ph','em','ad','ci'].forEach(k=>{$('#e-'+k).textContent=bad[k]||'';$('#'+k).setAttribute('aria-invalid',!!bad[k])});
const k=Object.keys(bad);if(k.length){$('#'+k[0]).focus();return}
/* INTEGRATION POINT: send order to ORDER_API / payment provider here */
cart=[];save();paint();$('#app').innerHTML=`<div class="wrap sec"><h1 style="font-size:3rem">Order request received</h1><p style="margin:16px 0;max-width:52ch">Thank you, ${esc(v('nm'))}. This demo does not send orders anywhere yet. Connect ORDER_API in CONFIG to receive real orders.</p><a class="btn" href="#/">Continue shopping</a></div>`;scrollTo(0,0)}}
document.addEventListener('click',e=>{const f=e.target.closest('[data-f]');if(f){F.cat=f.dataset.f;$('#shopbox').innerHTML=shop()}});
document.addEventListener('change',e=>{if(e.target.id=='so'){F.sort=e.target.value;$('#shopbox').innerHTML=shop()}});
document.addEventListener('submit',e=>{if(e.target.id=='nl'){e.preventDefault();toast('Thanks. Connect a mailing service in CONFIG to save sign-ups.');e.target.reset()}});
let raf;function tick(){cancelAnimationFrame(raf);const s=$('#sh');if(!s)return;const go=()=>{const d=new Date(),ms=d.getMilliseconds(),sc=d.getSeconds()+ms/1000,mn=d.getMinutes()+sc/60,hr=d.getHours()%12+mn/60;
$('#sh').setAttribute('transform',`rotate(${sc*6} 100 100)`);$('#mh').setAttribute('transform',`rotate(${mn*6} 100 100)`);$('#hh').setAttribute('transform',`rotate(${hr*30} 100 100)`);
raf=requestAnimationFrame(go)};if(matchMedia('(prefers-reduced-motion:reduce)').matches){const d=new Date();$('#sh').setAttribute('transform',`rotate(${d.getSeconds()*6} 100 100)`);$('#mh').setAttribute('transform',`rotate(${d.getMinutes()*6} 100 100)`);$('#hh').setAttribute('transform',`rotate(${d.getHours()%12*30+d.getMinutes()/2} 100 100)`)}else go()}
$('#bar').textContent=CONFIG.announcement;
$('#ft').innerHTML=[CONFIG.STORE_PHONE,CONFIG.STORE_EMAIL,CONFIG.STORE_ADDRESS].filter(Boolean).map(esc).join('<br>')||'<span class="ph">Contact details: set STORE_PHONE, STORE_EMAIL, STORE_ADDRESS in CONFIG</span>';
addEventListener('hashchange',route);paint();route();
</script></body></html>
